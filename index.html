<!DOCTYPE html>
<html>
  <head>
    <title>Squares</title>
    <link rel="icon" type="image/png" href="Assets/0.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="alticon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
    <script src="script2.js" defer></script>
    <style>
    img {
    user-select: none;
    -webkit-user-drag: none;
    }
    .bounce {
      position: absolute;
      will-change: left, top;
      cursor: pointer;
    }
    .bouncenostop {
      position: absolute;
      will-change: left, top;
      cursor: default;
    }
    .bounce:hover {
      transform: scale(1.05);
    }
    .catwhimsy {
      visibility: hidden;
    }
    .rainbowbg {
      visibility: hidden;
    }
    .secretsquare {
      visibility: hidden;
    }
    .gcircle {
      visibility: hidden;
    }
    .cr {
      visibility: hidden;
    }
    .guy {
      visibility: hidden;
      cursor: pointer;
    }
    .haitext {
      opacity: 0;
    }
    .flash {
      visibility: hidden;
    }
    .explode {
      visibility: hidden;
    }
    .confetti {
      visibility: hidden;
    }
    .dvd {
      visibility: hidden;
    }
    .bluescreen {
      visibility: hidden;
      cursor: default;
    }
    .blackscreen {
      visibility: hidden;
      cursor: default;
    }
    body
    {
      font-family: 'Comic Relief', cursive;    
      background-image: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
  <body id="body">
    <img id="rainbowbg" src="Assets/rainbow.gif" class="rainbowbg flex items-center h-screen w-full" width="3000" height="3000">
    <img id="confetti" src="Assets/confetti.gif" class="confetti fixed inset-0 flex items-center h-screen w-full" width="3000 flex items-center h-screen w-full" width="3000">
    
        <div class="bounce">
      <button onclick="pointclick()"><img src="Assets/8.png"></button>
    </div>
    <audio id="click" src="Assets/click.mp3"></audio>
    <script>
    var points = 0
      function pointclick(){
        document.getElementById('click').cloneNode(true).play();
        points += 1
        document.getElementById('pointtext').textContent = 'Points: ' + points;
      }
    </script>


    <div class="bounce">
      <button onclick="catwhimsyappear()"><img src="Assets/6.png"></button>
    </div>
    <audio id="meow" src="Assets/meow.mp3"></audio>
    <script>
      function catwhimsyappear(){
        document.getElementById('catwhimsy').style.visibility = 'visible';
        document.getElementById('catwhimsy2').style.visibility = 'visible';
        document.getElementById('catwhimsy3').style.visibility = 'visible';
        document.getElementById('meow').play();
      }
    </script>


    <div class="bounce">
      <button onclick="SelfDestruct()"><img src="Assets/5.png"></button>
    </div>
    <audio id="alarm" src="Assets/alarm.mp3"></audio>
    <audio id="explodeaudio" src="Assets/explosion.mp3"></audio>
    <script>
      async function SelfDestruct(){
        document.getElementById('alarm').play();
        document.getElementById('flash').style.visibility = 'visible';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'hidden';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'visible';
        document.getElementById('alarm').play();
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'hidden';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'visible';
        document.getElementById('alarm').play();
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'hidden';
        await new Promise(resolve => setTimeout(resolve, 1300)); //This single line was written by ai
        document.getElementById('explode').style.visibility = 'visible'; 
        document.getElementById('explodeaudio').play();
        await new Promise(resolve => setTimeout(resolve, 750)); //This single line was written by ai
        window.location.reload();
      }
    </script>
    <div id="explode" class="explode fixed inset-0 z-50 flex items-center h-screen w-full">
      <img src="Assets/explosion.gif" class="block mx-auto">
    </div>
    <img id="flash" src="Assets/flash.png" class="flash fixed inset-0 z-50 flex items-center h-screen w-full" width="3000" height="3000"> 
    

    <div class="bounce">
      <button onclick="hai()"><img src="Assets/4.png"></button>
    </div>
    <audio id="hai" src="Assets/hi.mp3"></audio>
    <script>
      function hai(){
        document.getElementById('hai').currentTime = 0;
        document.getElementById('hai').play();
        document.getElementById('haitext').animate([       //This animate portion is ai cuz i was so clueless
          { opacity: 1 }, 
          { opacity: 0 }  
          ], {
            duration: 1500,     
            fill: 'forwards'   
          });
      }
    </script>


    <div class="bounce">
      <button onclick="Confetti()"><img src="Assets/7.png"></button>
    </div>
    <audio id="yay" src="Assets/crowd.mp3"></audio>
    <script> 
      function Confetti(){
        if (document.getElementById('confetti').style.visibility == 'visible') {
          document.getElementById('confetti').style.visibility = 'hidden';
          document.getElementById('secretsquare').style.visibility = 'hidden';
        } else{
          document.getElementById('yay').play();
          document.getElementById('confetti').style.visibility = 'visible';
          document.getElementById('secretsquare').style.visibility = 'hidden';
          document.getElementById('rainbowbg').style.visibility = 'hidden'
          }
        }
    </script>
    
    <div class="bounce">
      <button id="seafoam" onclick="Bluescreen()"><img src="Assets/10.png"></button>
    </div>
    <button class="bluescreen fixed inset-0 z-50 flex items-center h-screen w-full" id="bluescreen" onclick=""><img src="Assets/bluescreen.png"></button>
    <button class="blackscreen fixed inset-0 z-50 flex items-center h-screen w-full" id="blackscreen" onclick=""><img src="Assets/black.png" width="3000" height="3000"></button>
    <script> 
      async function Bluescreen(){
        document.getElementById('blackscreen').style.visibility = 'visible';
        document.getElementById('body').style.filter = 'grayscale(0%)';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('blackscreen').style.visibility = 'hidden';
        document.getElementById('bluescreen').style.visibility = 'visible';
        await new Promise(resolve => setTimeout(resolve, 5000)); //This single line was written by ai
        document.getElementById('bluescreen').style.visibility = 'hidden';
      }
    </script>
    

    <div class="bounce grid place-items-center">
      <button id="gsquare" class="gsquare col-start-1 row-start-1" onclick="AlienMode()"><img src="Assets/3.png"></button>
      <button id="gcircle" class="gcircle col-start-1 row-start-1" onclick="SquareMode()"><img src="Assets/3alt.png"></button>
    </div>
    <audio id="alien" src="Assets/bogosbinted.mp3"></audio>
    <script>
      function AlienMode(){
        document.getElementById('gsquare').style.visibility = 'hidden';
        document.getElementById('gcircle').style.visibility = 'visible';
        document.getElementById('sq').style.visibility = 'hidden';
        document.getElementById('cr').style.visibility = 'visible';
        document.getElementById('alien').cloneNode(true).play();
      }
    </script>
    <script>
      function SquareMode(){
        document.getElementById('gcircle').style.visibility = 'hidden';
        document.getElementById('gsquare').style.visibility = 'visible';
        document.getElementById('sq').style.visibility = 'visible';
        document.getElementById('cr').style.visibility = 'hidden';
      }
    </script>


    <div class="bounce">
      <button onclick="monochrome()"><img src="Assets/2.png"></button>
    </div>
    <script>

      function monochrome(){
        if (document.getElementById('body').style.filter === 'grayscale(100%)') {
          document.getElementById('body').style.filter = 'grayscale(0%)';
          document.getElementById('secretsquare').style.visibility = 'hidden';
        } else{
          document.getElementById('body').style.filter = 'grayscale(100%)';
          if (document.getElementById('rainbowbg').style.visibility === 'visible') {
            document.getElementById('secretsquare').style.visibility = 'visible';
          } else{
            document.getElementById('secretsquare').style.visibility = 'hidden';
          }
        }
      }
    </script>
    

    <div class="bounce">
      <button id="orange" onclick="rotateorange()"><img src="Assets/1.png"></button>
    </div>
    <script>
      var currentrotate = 0
      function rotateorange(){
        currentrotate += .94
        document.getElementById('orange').style.rotate = ''+currentrotate+'deg';
      }
    </script>


    <div class="bounce grid place-items-center">
      <button id="dvdsq" class="col-start-1 row-start-1" onclick="dvdmode()"><img src="Assets/9.png"></button>
      <button id="dvd" class="dvd col-start-1 row-start-1" onclick="dvdsqmode()"><img src="Assets/dvd.png" width="256"></button>
    </div>
    <script>
      function dvdmode(){
        document.getElementById('dvdsq').style.visibility = 'hidden';
        document.getElementById('dvd').style.visibility = 'visible';
      }
    </script>
    <script>
      function dvdsqmode(){
        document.getElementById('dvd').style.visibility = 'hidden';
        document.getElementById('dvdsq').style.visibility = 'visible';
      }
    </script>
    

    <div class="bounce">
      <button onclick="bgrainbow()"><img src="Assets/0.png"></button>
    </div>
    <script>
      function bgrainbow(){
        if (document.getElementById('rainbowbg').style.visibility === 'visible') {
          document.getElementById('rainbowbg').style.visibility = 'hidden';
          document.getElementById('secretsquare').style.visibility = 'hidden';
        } else{
          document.getElementById('rainbowbg').style.visibility = 'visible';
          document.getElementById('confetti').style.visibility = 'hidden';
          if (document.getElementById('body').style.filter === 'grayscale(100%)') {
            document.getElementById('secretsquare').style.visibility = 'visible';
          } else{
            document.getElementById('secretsquare').style.visibility = 'hidden';
          }
        }
      }
    </script>


    <div class="bouncenostop">
      <button id="secretsquare" class="secretsquare" onclick="rainbowsquare()"><img src="Assets/rainbow.gif" width="128px"></button>
    </div>
    <script>
      function rainbowsquare(){
        document.getElementById('guy').style.visibility = 'visible';
        document.getElementById('guyt').style.visibility = 'visible';
      }
    </script>
    
    
    <p id="haitext" class="haitext text-3xl bouncenostop">hai</p>


    <button onclick="mwehehe()"><img id="guy" class="guy bouncenostop" src="Assets/lilguy.png" width="32" height="32"></button>
    <audio id="mwehehe" src="Assets/mwehehe.mp3"></audio>
    <script>
      function mwehehe(){
        document.getElementById('mwehehe').currentTime = 0;
        document.getElementById('mwehehe').play();
        points += 6
        document.getElementById('pointtext').textContent = 'Points: ' + points;
      }
    </script>
    

    <div id="catwhimsy" class="catwhimsy bounce">
      <button onclick="catwhimsygone()"><img src="Assets/cat.jpeg"></button>
    </div>
    <div id="catwhimsy2" class="catwhimsy bounce">
      <button onclick="catwhimsygone2()"><img src="Assets/cat.jpeg"></button>
    </div>
    <div id="catwhimsy3" class="catwhimsy bounce">
      <button onclick="catwhimsygone3()"><img src="Assets/cat.jpeg"></button>
    </div>
    <script>
      var cwg = 0
      function catwhimsygone(){
        cwg += 1
        points += 2
        document.getElementById('meow').currentTime = 0;
        document.getElementById('meow').play();    //cloneNode(true)
        document.getElementById('pointtext').textContent = 'Points: ' + points;
        if (cwg > 2) { 
          document.getElementById('catwhimsy').style.visibility = 'hidden';
          points += 2
          document.getElementById('pointtext').textContent = 'Points: ' + points;
          cwg = 0
        }
      }
    </script>
    <script>
      var cwg2 = 0
      function catwhimsygone2(){
        cwg2 += 1
        points += 2
        document.getElementById('meow').currentTime = 0;
        document.getElementById('meow').play();    //cloneNode(true)
        document.getElementById('pointtext').textContent = 'Points: ' + points;
        if (cwg2 > 2) { 
          document.getElementById('catwhimsy2').style.visibility = 'hidden';
          points += 2
          document.getElementById('pointtext').textContent = 'Points: ' + points;
          cwg2 = 0
        }
      }
    </script>
    <script>
    var cwg3 = 0
      function catwhimsygone3(){
        cwg3 += 1
        points += 2
        document.getElementById('meow').currentTime = 0;
        document.getElementById('meow').play();    //cloneNode(true)
        document.getElementById('pointtext').textContent = 'Points: ' + points;
        if (cwg3 > 2) { 
          document.getElementById('catwhimsy3').style.visibility = 'hidden';
          document.getElementById('pointtext').textContent = 'Points: ' + points;
          cwg3 = 0
        }
      }
    </script>

    <p id="sq" style="white-space: nowrap;" class="sq text-3xl font-bold bouncenostop" >Click The Cubes :3</p>
    <p id="pointtext" style="white-space: nowrap;" class="sq text-3xl font-bold bouncenostop" >Points: 0</p>
    <p id="cr" style="white-space: nowrap;" class="cr text-3xl font-bold bouncenostop" >Click The Cubes (or Alien) :3</p>
    <p id="guyt" style="white-space: nowrap;" class="guy text-3xl bouncenostop" >congrats u get a lil guy now :3</p>
  </body>
</html>

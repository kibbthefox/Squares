<!DOCTYPE html>
<html>
  <head>
    <title>Squares</title>
    <link rel="icon" type="image/png" href="Assets/0.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="alticon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
    <script src="script2.js" defer></script>
    <style>
    .bounce {
      position: absolute;
      will-change: left, top;
      cursor: pointer;
    }
    .bouncenostop {
      position: absolute;
      will-change: left, top;
      cursor: default;
    }
    .bounce:hover {
      transform: scale(1.05);
    }
    .catwhimsy {
      visibility: hidden;
    }
    .rainbowbg {
      visibility: hidden;
    }
    .secretsquare {
      visibility: hidden;
    }
    .gcircle {
      visibility: hidden;
    }
    .cr {
      visibility: hidden;
    }
    .guy {
      visibility: hidden;
      cursor: pointer;
    }
    .haitext {
      opacity: 0;
    }
    .flash {
      visibility: hidden;
    }
    .explode {
      visibility: hidden;
    }
    body
    {
      font-family: 'Comic Relief', cursive;    
      background-image: none;
    }
  </style>
</head>
  <body id="body">


    <div class="bounce">
      <button onclick="catwhimsyappear()"><img src="Assets/6.png"></button>
    </div>
    <audio id="meow" src="Assets/meow.mp3"></audio>
    <script>
      function catwhimsyappear(){
        if (document.getElementById('catwhimsy').style.visibility === 'visible') {
          
        } else{
          document.getElementById('catwhimsy').style.visibility = 'visible';
          document.getElementById('meow').play();
        }
      }
    </script>


    <div class="bounce">
      <button onclick="SelfDestruct()"><img src="Assets/5.png"></button>
    </div>
    <audio id="alarm" src="Assets/alarm.mp3"></audio>
    <audio id="explodeaudio" src="Assets/explosion.mp3"></audio>
    <script>
      async function SelfDestruct(){
        document.getElementById('alarm').play();
        document.getElementById('flash').style.visibility = 'visible';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'hidden';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'visible';
        document.getElementById('alarm').play();
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'hidden';
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'visible';
        document.getElementById('alarm').play();
        await new Promise(resolve => setTimeout(resolve, 1500)); //This single line was written by ai
        document.getElementById('flash').style.visibility = 'hidden';
        await new Promise(resolve => setTimeout(resolve, 1300)); //This single line was written by ai
        document.getElementById('explode').style.visibility = 'visible'; 
        document.getElementById('explodeaudio').play();
        await new Promise(resolve => setTimeout(resolve, 750)); //This single line was written by ai
        window.location.reload();
      }
    </script>
    <div id="explode" class="explode fixed inset-0 z-50 flex items-center h-screen w-full">
      <img src="Assets/explosion.gif" class="block mx-auto">
    </div>


    <div class="bounce">
      <button onclick="hai()"><img src="Assets/4.png"></button>
    </div>
    <audio id="hai" src="Assets/hi.mp3"></audio>
    <script>
      function hai(){
        document.getElementById('hai').play();
        document.getElementById('haitext').animate([       //This animate portion is ai cuz i was so clueless
          { opacity: 1 }, 
          { opacity: 0 }  
          ], {
            duration: 1500,     
            fill: 'forwards'   
          });
      }
    </script>


    <div class="bounce grid place-items-center">
      <button id="gsquare" class="gsquare col-start-1 row-start-1" onclick="CircleMode()"><img src="Assets/3.png"></button>
      <button id="gcircle" class="gcircle col-start-1 row-start-1" onclick="SquareMode()"><img src="Assets/3alt.png"></button>
    </div>
    <script>
      function CircleMode(){
        document.getElementById('gsquare').style.visibility = 'hidden';
        document.getElementById('gcircle').style.visibility = 'visible';
        document.getElementById('sq').style.visibility = 'hidden';
        document.getElementById('cr').style.visibility = 'visible';
      }
    </script>
    <script>
      function SquareMode(){
        document.getElementById('gcircle').style.visibility = 'hidden';
        document.getElementById('gsquare').style.visibility = 'visible';
        document.getElementById('sq').style.visibility = 'visible';
        document.getElementById('cr').style.visibility = 'hidden';
      }
    </script>


    <div class="bounce">
      <button onclick="monochrome()"><img src="Assets/2.png"></button>
    </div>
    <script>

      function monochrome(){
        if (document.getElementById('body').style.filter === 'grayscale(100%)') {
          document.getElementById('body').style.filter = 'grayscale(0%)';
          document.getElementById('secretsquare').style.visibility = 'hidden';
        } else{
          document.getElementById('body').style.filter = 'grayscale(100%)';
          if (document.getElementById('rainbowbg').style.visibility === 'visible') {
            document.getElementById('secretsquare').style.visibility = 'visible';
          } else{
            document.getElementById('secretsquare').style.visibility = 'hidden';
          }
        }
      }
    </script>
    <img id="rainbowbg" src="Assets/rainbow.gif" class="rainbowbg flex items-center h-screen w-full" width="3000" height="3000">
   

    <div class="bounce">
      <button id="orange" onclick="rotateorange()"><img src="Assets/1.png"></button>
    </div>
    <script>
      var currentrotate = 0
      function rotateorange(){
        currentrotate += .94
        document.getElementById('orange').style.rotate = ''+currentrotate+'deg';
      }
    </script>
    <img id="flash" src="Assets/flash.png" class="flash fixed inset-0 z-50 flex items-center h-screen w-full" width="3000" height="3000"> 

    <div class="bounce">
      <button onclick="bgrainbow()"><img src="Assets/0.png"></button>
    </div>
    <script>
      function bgrainbow(){
        if (document.getElementById('rainbowbg').style.visibility === 'visible') {
          document.getElementById('rainbowbg').style.visibility = 'hidden';
          document.getElementById('secretsquare').style.visibility = 'hidden';
        } else{
          document.getElementById('rainbowbg').style.visibility = 'visible';
          if (document.getElementById('body').style.filter === 'grayscale(100%)') {
            document.getElementById('secretsquare').style.visibility = 'visible';
          } else{
            document.getElementById('secretsquare').style.visibility = 'hidden';
          }
        }
      }
    </script>
    

    <div class="bouncenostop">
      <button id="secretsquare" class="secretsquare" onclick="rainbowsquare()"><img src="Assets/rainbow.gif" width="128px"></button>
    </div>
    <script>
      function rainbowsquare(){
        document.getElementById('guy').style.visibility = 'visible';
        document.getElementById('guyt').style.visibility = 'visible';
      }
    </script>
    
    
    <p id="haitext" class="haitext text-3xl bouncenostop">hai</p>


    <button onclick="mwehehe()"><img id="guy" class="guy bouncenostop" src="Assets/lilguy.png" width="32" height="32"></button>
    <audio id="mwehehe" src="Assets/mwehehe.mp3"></audio>
    <script>
      function mwehehe(){
        document.getElementById('mwehehe').play();
      }
    </script>
    

    <div id="catwhimsy" class="catwhimsy bounce">
      <button onclick="catwhimsygone()"><img src="Assets/cat.jpeg"></button>
    </div>
    <script>
      function catwhimsygone(){
        document.getElementById('catwhimsy').style.visibility = 'hidden';
      }
    </script>

    <p id="sq" style="white-space: nowrap;" class="sq text-3xl font-bold bouncenostop" >Click The Cubes :3</p>
    <p id="cr" style="white-space: nowrap;" class="cr text-3xl font-bold bouncenostop" >Click The Cubes (or circle) :3</p>
    <p id="guyt" style="white-space: nowrap;" class="guy text-3xl bouncenostop" >congrats u get a lil guy now :3</p>
  </body>
</html>

      cursor: pointer;
    }
    .bouncenostop {
      position: absolute;
      will-change: left, top;
      cursor: default;
    }
    .bounce:hover {
      transform: scale(1.05);

    body {

      -webkit-user-select: none;
      -ms-user-select: none;
